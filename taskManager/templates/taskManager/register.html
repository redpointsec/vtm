
{% extends 'taskManager/base.html' %}
      
        {% block content %}
        {% if registered %}
            <div class="col-lg-7 col-md-9">
                <div class="alert alert-success" role="alert">
                    <p><strong>Thanks for registering!</strong></p>
                    <p class="mb-0"><a href="/taskManager/login">Return to the homepage.</a></p>
                </div>
            </div>
        {% else %}
        
          <div class="col-lg-7 col-md-9">
               <div class="card">
                   <div class="card-header">
                       <h4 class="mb-0">Registration</h4>
                   </div>
                   <div class="card-body">
                   <form method="post" role="form" action="/taskManager/register/" enctype="multipart/form-data">
                      {% csrf_token %}
                     <div class="row g-3">
                      <!-- {{ user_form }} -->
                        <div class="col-12">
                           <label class="form-label" for="id_username">Username:</label>
                           <input class="form-control" id="id_username" name="username" type="text" />
                        </div>
                        <div class="col-md-6">
                           <label class="form-label" for="id_first_name">First name:</label>
                           <input class="form-control" id="id_first_name" name="first_name" type="text" />
                        </div>
                        <div class="col-md-6">
                           <label class="form-label" for="id_last_name">Last name:</label>
                           <input class="form-control" id="id_last_name" name="last_name" type="text" />
                        </div>
                        <div class="col-12">
                           <label class="form-label" for="id_email">Email:</label>
                           <input class="form-control" id="id_email" name="email" type="text" />
                        </div>
                        <div class="col-md-6">
                           <label class="form-label" for="id_dob">Date of Birth:</label>
                           <input class="form-control" placeholder="mm/dd/yy" id="id_dob" name="dob" type="text" />
                        </div>
                        <div class="col-md-6">
                           <label class="form-label" for="id_ssn">Social Security Number:</label>
                           <input class="form-control" placeholder="xxx-xx-xxxx" id="id_ssn" name="ssn" type="password" />
                        </div>
                        <div class="col-12">
                           <label class="form-label" for="id_password">Password:</label>
                           <input class="form-control" id="id_password" name="password" type="password" />
                        </div>
                     </div>  
                       <button class="btn btn-danger mt-3" type="submit">Register</button>
                   </form>
          
                   </div>
               </div>
          </div>
        
        {% endif %}
        
        {%  endblock %}
